# cargo-deny (CI: Dependencies job). The targets Plyfold ships for: macOS, Windows and Linux
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
# Unmaintained (not vulnerable) crates that only Linux builds pull in, through Tauri's GTK stack and the zbus used by
# opener and the notification plugin. None has a release to move to from here; revisit when Tauri moves to GTK 4 /
# zbus 6
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, a build-time macro of glib 0.18 (Tauri's GTK 3 stack)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant, merged into zbus 6; zbus 5 comes from opener and tauri-plugin-notification" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, merged into zbus 6; as above" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, merged into zbus 6; as above" },
]

[licenses]
version = 2
# Licenses the dependencies use today, all fine inside an MIT app (MPL-2.0 is file-level copyleft and fine unmodified).
# Add one here only after checking it
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
  # ring, rustls-webpki and untrusted (TLS for the updater's downloads); a permissive licence like MIT
  "ISC",
]
confidence-threshold = 0.8

[licenses.private]
# The workspace's own crates (publish = false)
ignore = true

[bans]
# Tauri pulls several versions of some crates; that is not a problem by itself
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
