[package]
name = "plyfold-acp"
version = "0.4.1"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# session/fork is gated by this feature in schema 1.18 (no extra crates)
agent-client-protocol-schema = { version = "1.18.0", default-features = false, features = ["unstable_session_fork"] }
plyfold-i18n = { version = "0.4.1", path = "../plyfold-i18n" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "io-std", "sync", "time", "rt", "macros"] }
tracing = "0.1.44"

# Finds .cmd / .exe launchers on the PATH (Unix spawns by name)
[target."cfg(windows)".dependencies]
which = "8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
