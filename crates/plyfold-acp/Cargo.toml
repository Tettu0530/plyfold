[package]
name = "plyfold-acp"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
agent-client-protocol-schema = { version = "1.18.0", default-features = false }
plyfold-i18n = { version = "0.1.0", path = "../plyfold-i18n" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "io-std", "sync", "time", "rt", "macros"] }
tracing = "0.1.44"
which = "8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
