[package]
name = "plyfold-acp"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol-schema = { version = "1.18.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "io-std", "sync", "time", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
