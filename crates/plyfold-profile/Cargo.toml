[package]
name = "plyfold-profile"
version = "0.6.3"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dirs = "7"
plyfold-acp = { version = "0.6.3", path = "../plyfold-acp" }
plyfold-i18n = { version = "0.6.3", path = "../plyfold-i18n" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
which = "8"
toml_edit = { version = "0.25.19", features = ["serde"] }

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

# The Secret Service (GNOME Keyring, KWallet) over D-Bus; the encryption runs in Rust, so only libdbus is needed
[target."cfg(target_os = \"linux\")".dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
