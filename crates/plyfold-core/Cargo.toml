[package]
name = "plyfold-core"
version = "0.6.4"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
jiff = "1.0"
plyfold-acp = { version = "0.6.4", path = "../plyfold-acp" }
plyfold-i18n = { version = "0.6.4", path = "../plyfold-i18n" }
plyfold-profile = { version = "0.6.4", path = "../plyfold-profile" }
plyfold-store = { version = "0.6.4", path = "../plyfold-store" }
plyfold-worktree = { version = "0.6.4", path = "../plyfold-worktree" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
