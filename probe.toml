# plyfold-probe configuration
#
# [agents.<id>]   command that starts the agent as an ACP server
#   config_dir_env  env var that redirects the config directory when profiles are separated (some unverified)
#   key_envs        env vars NOT inherited from the parent process (so keys never mix)
#
# [profiles.<name>]  an agent x credentials pair
#   isolate = true   give the profile its own config directory
#   keys             ENV_VAR_NAME = source
#                      "keychain"      -> stored with: plyfold-probe keys set <profile> <ENV>
#                      "env:OTHER_VAR" -> taken from the current environment
#
# Passing a bare agent name runs a default profile that overrides nothing (uses the existing login)

[agents.claude]
command = "npx"
args = ["-y", "@agentclientprotocol/claude-agent-acp@0.107.0"]
config_dir_env = "CLAUDE_CONFIG_DIR"
key_envs = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN"]

[agents.codex]
command = "npx"
args = ["-y", "@agentclientprotocol/codex-acp@2.6.0"]
config_dir_env = "CODEX_HOME"
key_envs = ["OPENAI_API_KEY", "CODEX_API_KEY"]

[agents.opencode]
command = "opencode"
args = ["acp"]
# OpenCode is assumed to keep its config and auth under XDG paths (unverified)
config_dir_env = "XDG_DATA_HOME"
key_envs = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "GEMINI_API_KEY"]

[agents.gemini]
command = "npx"
args = ["-y", "@google/gemini-cli@0.68.0", "--experimental-acp"]
key_envs = ["GEMINI_API_KEY", "GOOGLE_API_KEY"]

# --- Example profiles (store the keys first) ---

[profiles.claude-key-a]
agent = "claude"
isolate = true
keys = { ANTHROPIC_API_KEY = "keychain" }

[profiles.claude-key-b]
agent = "claude"
isolate = true
keys = { ANTHROPIC_API_KEY = "keychain" }

[profiles.codex-key-a]
agent = "codex"
isolate = true
keys = { OPENAI_API_KEY = "keychain" }
