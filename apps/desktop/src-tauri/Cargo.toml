[package]
name = "plyfold-desktop"
version = "0.8.0"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false
description = "Plyfold desktop app (Tauri)"

[lib]
name = "plyfold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
opener = { version = "0.9", features = ["reveal"] }
plyfold-core = { version = "0.8.0", path = "../../../crates/plyfold-core" }
plyfold-i18n = { version = "0.8.0", path = "../../../crates/plyfold-i18n" }
plyfold-profile = { version = "0.8.0", path = "../../../crates/plyfold-profile" }
plyfold-store = { version = "0.8.0", path = "../../../crates/plyfold-store" }
plyfold-worktree = { version = "0.8.0", path = "../../../crates/plyfold-worktree" }
portable-pty = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
# unstable: a webview inside the main window (the browser pane)
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["sync"] }
